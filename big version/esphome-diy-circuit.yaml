substitutions:
  device_name: voice-assistant-livingroom
  friendly_name: Voice Assistant Livingroom

  spk_bclk: GPIO7
  spk_lrc: GPIO6
  spk_din: GPIO5

  amp_sd_pin: GPIO18

  mic_bclk: GPIO1
  mic_lrcl: GPIO2
  mic_dout: GPIO4
  led_pin: GPIO48

  i2c_sda: GPIO10
  i2c_scl: GPIO11

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(output_mode_is_amp) = (id(audio_output_mode).current_option() == "DAC and Amp");
      - script.execute: apply_output_mode

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    then:
      - delay: 600ms
      - script.execute: start_wake_word
  on_client_disconnected:
    then:
      - script.execute: stop_wake_word
      - voice_assistant.stop
      - switch.turn_off: amp_enable

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  manual_ip:
    static_ip: !secret diy_static_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
  ap:
    ssid: esp32s3-va-fallback
    password: !secret ap_password

captive_portal:


globals:
  - id: timer_display_text
    type: std::string
    initial_value: '""'
  - id: output_mode_is_amp
    type: bool
    initial_value: 'false'

network:
  enable_high_performance: true

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: true

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 10
  - file: "fonts/DejaVuSans.ttf"
    id: font_big
    size: 28
    glyphs: '!"%()+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ^_abcdefghijklmnopqrstuvwxyzäöüÄÖÜß°'

time:
  - platform: homeassistant
    id: esptime

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true
  frequency: 100kHz

rtttl:
  speaker: ann_resamp
  on_finished_playback:
    - if:
        condition:
          and:
            - not:
                media_player.is_playing: esp32_media
            - not:
                media_player.is_announcing: esp32_media
            - not:
                voice_assistant.is_running
        then:
          - switch.turn_off: amp_enable

i2s_audio:
  - id: bus_output
    i2s_lrclk_pin: ${spk_lrc}
    i2s_bclk_pin: ${spk_bclk}

  - id: bus_input
    i2s_lrclk_pin: ${mic_lrcl}
    i2s_bclk_pin: ${mic_bclk}

microphone:
  - platform: i2s_audio
    id: mic_hw
    i2s_audio_id: bus_input
    i2s_din_pin: ${mic_dout}
    adc_type: external
    pdm: false
    use_apll: true
    bits_per_sample: 32bit
    channel: left
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: spk_out
    i2s_audio_id: bus_output
    i2s_dout_pin: ${spk_din}
    dac_type: external
    channel: stereo
    sample_rate: 44100
    bits_per_sample: 16bit
    use_apll: true
    buffer_duration: 200ms

  - platform: mixer
    id: spk_mixer
    output_speaker: spk_out
    source_speakers:
      - id: ann_in
      - id: media_in

  - platform: resampler
    id: ann_resamp
    output_speaker: ann_in

  - platform: resampler
    id: media_resamp
    output_speaker: media_in

media_player:
  - platform: speaker
    id: esp32_media
    name: "ESP32 Speaker"
    on_state:
      then:
        - if:
            condition:
              or:
                - media_player.is_playing: esp32_media
                - media_player.is_announcing: esp32_media
            then:
              - script.execute: apply_output_mode
            else:
              - switch.turn_off: amp_enable

    announcement_pipeline:
      speaker: ann_resamp
      format: WAV
      sample_rate: 44100

    media_pipeline:
      speaker: media_resamp
      format: WAV
      sample_rate: 44100

    on_play:
      then:
        - script.execute: apply_output_mode
        - script.execute: stop_wake_word
        - voice_assistant.stop
        - microphone.mute: mic_hw

    on_announcement:
      then:
        - script.execute: apply_output_mode
        - script.execute: stop_wake_word
        - microphone.mute: mic_hw

    on_idle:
      then:
        - switch.turn_off: amp_enable
        - microphone.unmute: mic_hw
        - script.execute: start_wake_word

    on_pause:
      then:
        - switch.turn_off: amp_enable
        - microphone.unmute: mic_hw
        - script.execute: start_wake_word

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: ${led_pin}
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - pulse:
          name: speaking_pulse
          min_brightness: 10%
          max_brightness: 60%
      - pulse:
          name: fast_pulse
          transition_length: 120ms
          update_interval: 120ms
          min_brightness: 20%
          max_brightness: 80%

switch:
  - platform: gpio
    id: amp_enable
    pin: ${amp_sd_pin}
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: template
    id: night_mode
    name: "Night Mode"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: display_power
    name: "Display Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(oled).turn_on();'
    turn_off_action:
      - lambda: 'id(oled).turn_off();'

  - platform: template
    id: mic_mute
    name: "Mute"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: stop_wake_word
      - voice_assistant.stop
      - microphone.mute: mic_hw
      - switch.turn_off: amp_enable
      - script.execute: led_mute
    on_turn_off:
      - microphone.unmute: mic_hw
      - delay: 200ms
      - script.execute: led_ready
      - script.execute: start_wake_word

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      int x = it.get_width() / 2;
      int y = it.get_height() / 2;

      if (id(night_mode).state || !id(display_power).state) {
        it.print(x, y, id(font_big), TextAlign::CENTER, "");
        return;
      } else if (id(mic_mute).state && !(id(night_mode).state || !id(display_power).state)) {
        it.print(x, y, id(font_big), TextAlign::CENTER, "(-_-)");
      } else if (id(va).is_running()) {
        if (id(esp32_media).state == esphome::media_player::MEDIA_PLAYER_STATE_PLAYING && !(id(night_mode).state || !id(display_power).state)) {
          it.print(x, y, id(font_big), TextAlign::CENTER, "(^_^)");
        } else {
          it.print(x, y, id(font_big), TextAlign::CENTER, "(o_o)");
        }
      } else if (!id(timer_display_text).empty() && !(id(night_mode).state || !id(display_power).state)) {
        it.printf(x, y, id(font_big), TextAlign::CENTER, id(timer_display_text).c_str());
      } else {
        it.strftime(x, y, id(font_big), TextAlign::CENTER, "%H:%M", id(esptime).now());
      }

select:
  - platform: template
    id: audio_output_mode
    name: "Audio Output"
    optimistic: true
    restore_value: true
    initial_option: "DAC and Amp"
    options:
      - "DAC only"
      - "DAC and Amp"
    set_action:
      - globals.set:
          id: output_mode_is_amp
          value: !lambda 'return x == "DAC and Amp";'
      - script.execute: apply_output_mode
    on_value:
      - globals.set:
          id: output_mode_is_amp
          value: !lambda 'return x == "DAC and Amp";'

micro_wake_word:
  id: mww
  microphone:
    microphone: mic_hw
    channels: 0
    gain_factor: 4
  models:
    - model: hey_jarvis
      id: jarvis_model
    - model: okay_nabu
      id: nabu_model

  on_wake_word_detected:
    then:
      - script.execute: stop_wake_word
      - if:
          condition:
            switch.is_off: mic_mute
          then:
            - voice_assistant.start:
                wake_word: !lambda return wake_word;
            - delay: 2s
            - if:
                condition:
                  not:
                    voice_assistant.is_running
                then:
                  - script.execute: start_wake_word
          else:
            - script.execute: start_wake_word

voice_assistant:
  id: va
  micro_wake_word: mww
  use_wake_word: false
  microphone:
    microphone: mic_hw
    channels: 0
    gain_factor: 4
  media_player: esp32_media
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 8.0

  # Updates the timer text on the display
  on_timer_tick:
    - lambda: |-
        if (!timers.empty()) {
          int total_seconds = timers[0].seconds_left;
          int minutes = total_seconds / 60;
          int seconds = total_seconds % 60;
          id(timer_display_text) = str_sprintf("%02d:%02d", minutes, seconds);
        } else {
          id(timer_display_text) = "";
        }

  on_timer_finished:
    - then:
        - micro_wake_word.stop
        - voice_assistant.stop
        - media_player.stop: esp32_media
        - lambda: |-
            id(ann_resamp).set_volume(0.8f);
            id(timer_display_text) = "";  // Clear timer text when finished
        - rtttl.play: "timer:d=8,o=4,b=90: g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e"
        - script.execute: led_error
        - light.turn_on:
            id: status_led
            effect: fast_pulse
            red: 100%
            green: 0%
            blue: 0%
        - delay: 10s 
        - rtttl.stop:
        - lambda: 'id(ann_resamp).set_volume(0.6f);'
        - light.turn_off: status_led
        - script.execute: led_ready
        - script.execute: start_wake_word

  on_listening:
    then:
      - script.execute: led_listening
      - script.execute: beep_start
  on_stt_vad_end:
    then:
      - script.execute: led_thinking
      - script.execute: beep_stop
  on_tts_start:
    then:
      - script.execute: led_speaking
  on_tts_end:
    then:
      - script.execute: led_ready

script:
  - id: apply_output_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(output_mode_is_amp);'
          then:
            - switch.turn_on: amp_enable
          else:
            - switch.turn_off: amp_enable

  - id: start_wake_word
    mode: restart
    then:
      - if:
          condition:
            and:
              - api.connected
              - switch.is_off: mic_mute
              - not:
                  voice_assistant.is_running
              - not:
                  micro_wake_word.is_running
          then:
            - delay: 100ms
            - micro_wake_word.start

  - id: stop_wake_word
    mode: restart
    then:
      - micro_wake_word.stop
  
  - id: led_off
    then:
      - light.turn_off: status_led

  - id: led_ready
    then:
      - light.turn_off: status_led

  - id: led_mute
    then:
      - light.turn_on:
          id: status_led
          brightness: 50%
          red: 100%
          green: 0%
          blue: 0%
          effect: none

  - id: led_error
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 100%
          green: 0%
          blue: 0%
          effect: fast_pulse

  - id: led_listening
    then:
      - light.turn_on:
          id: status_led
          brightness: 80%
          red: 0%
          green: 0%
          blue: 100%
          effect: none

  - id: led_thinking
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 100%
          green: 60%
          blue: 0%
          effect: none

  - id: led_speaking
    then:
      - light.turn_on:
          id: status_led
          brightness: 70%
          red: 0%
          green: 100%
          blue: 0%
          effect: speaking_pulse
  - id: beep_start
    mode: restart
    then:
      - script.execute: apply_output_mode
      - delay: 80ms
      - rtttl.play: "listen:d=16,o=6,b=160:c,e,g"

  - id: beep_stop
    mode: restart
    then:
      - script.execute: apply_output_mode
      - delay: 80ms
      - rtttl.play: "done:d=16,o=6,b=160:g,e,c"

interval:
  - interval: 10s
    then:
      - script.execute: start_wake_word