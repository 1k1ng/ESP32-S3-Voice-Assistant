substitutions:
  device_name: voice-assistant-kitchen
  friendly_name: Voice Assistant Kitchen WS

  # --- Waveshare ESP32-S3-RGB-Matrix: onboard audio (ES8311 DAC + ES7210 mic ADC) ---
  # Mic and speaker share the clock pins (see i2s_audio below)
  i2s_mclk: GPIO12
  i2s_bclk: GPIO43
  i2s_lrclk: GPIO38
  i2s_dout: GPIO21      # ESP32 -> ES8311 (speaker)
  i2s_din: GPIO39       # ES7210 -> ESP32 (mics)
  amp_pa_pin: GPIO11    # PA enable (HIGH = amp on)

  # Onboard I2C bus (ES8311 0x18, ES7210 0x40, SHTC3, QMI8658, PCF85063)
  codec_sda: GPIO47
  codec_scl: GPIO48

  # External OLED on its own I2C bus (header pins IO45 / IO46)
  oled_sda: GPIO45
  oled_scl: GPIO46

  # Status LED (WS2812). The old GPIO48 is now I2C SCL, so it moved.
  # GPIO44 is not used by HUB75/audio/I2C, but VERIFY it is on your header.
  led_pin: GPIO44

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  compile_process_limit: 2
  on_boot:
    priority: -100
    then:
      - pcf85063.read_time:
          id: rtc_time
      # The mic is the clock master: keep it capturing so the speaker always
      # has BCLK/LRCK/MCLK (also while wake word / assistant are stopped)
      - microphone.capture: mic_hw
      - lambda: |-
          id(output_mode_is_amp) = (id(audio_output_mode).current_option() == "DAC and Amp");
      - script.execute: apply_output_mode

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

logger:
  level: INFO
  # GPIO43/44 (default UART0) are used by the board, so log over native USB
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    then:
      - delay: 600ms
      - script.execute: start_wake_word
  on_client_disconnected:
    then:
      - script.execute: stop_wake_word
      - voice_assistant.stop
      - switch.turn_off: amp_enable

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  manual_ip:
    static_ip: !secret waveshare_static_ip
    gateway: !secret wifi_gateway
    subnet: !secret wifi_subnet
  ap:
    ssid: esp32s3-va-fallback
    password: !secret ap_password

captive_portal:


globals:
  - id: timer_display_text
    type: std::string
    initial_value: '""'
  - id: output_mode_is_amp
    type: bool
    initial_value: 'false'

network:
  enable_high_performance: true

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: true

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 10
  - file: "fonts/DejaVuSans.ttf"
    id: font_big
    size: 28
    glyphs: '!"%()+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ^_abcdefghijklmnopqrstuvwxyzäöüÄÖÜß°'
  - file: "fonts/DejaVuSans.ttf"
    id: font_mid
    size: 16
    glyphs: '%.-0123456789°C'

time:
  # Onboard RTC (PCF85063): keeps the time without WLAN / Home Assistant
  - platform: pcf85063
    id: rtc_time
    i2c_id: bus_codec
  - platform: homeassistant
    id: esptime
    on_time_sync:
      then:
        - pcf85063.write_time:
            id: rtc_time

sensor:
  # Onboard SHTC3 temperature / humidity
  - platform: shtcx
    i2c_id: bus_codec
    address: 0x70
    update_interval: 60s
    # Raw values (heated by ESP32 / amp / case), hidden by default
    temperature:
      id: raw_temp
      name: "Temperature (raw)"
      disabled_by_default: true
    humidity:
      id: raw_hum
      name: "Humidity (raw)"
      disabled_by_default: true

  # Corrected room temperature: raw minus adjustable offset
  - platform: template
    id: room_temp
    name: "Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (!id(raw_temp).has_state()) return {};
      return id(raw_temp).state - id(temp_offset).state;

  # Corrected humidity: same absolute moisture, recomputed at the corrected
  # temperature (Magnus formula)
  - platform: template
    id: room_hum
    name: "Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(raw_temp).has_state() || !id(raw_hum).has_state()) return {};
      float t_raw = id(raw_temp).state;
      float t_cor = t_raw - id(temp_offset).state;
      float es_raw = 6.112f * expf(17.62f * t_raw / (243.12f + t_raw));
      float es_cor = 6.112f * expf(17.62f * t_cor / (243.12f + t_cor));
      float rh = id(raw_hum).state * es_raw / es_cor;
      return std::min(100.0f, std::max(0.0f, rh));

number:
  # Adjustable in Home Assistant, survives reboots
  - platform: template
    id: temp_offset
    name: "Temperature Offset"
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 9.7
    min_value: 0
    max_value: 20
    step: 0.1
    unit_of_measurement: "K"
    on_value:
      then:
        - component.update: room_temp
        - component.update: room_hum

# Onboard QMI8658 IMU (0x6B, or 0x6A if not found).
# The only ESPHome component I found is written for the Arduino framework
# and may not compile with esp-idf, so it is disabled. Enable and test if needed:
#
# external_components:
#   - source: github://dala318/esphome-qmi8658
#
# sensor:
#   - platform: qmi8658
#     i2c_id: bus_codec
#     address: 0x6B
#     acceleration_x:
#       name: "IMU Acceleration X"
#     acceleration_y:
#       name: "IMU Acceleration Y"
#     acceleration_z:
#       name: "IMU Acceleration Z"

i2c:
  # Onboard bus for the audio codecs
  - id: bus_codec
    sda: ${codec_sda}
    scl: ${codec_scl}
    scan: true
    frequency: 400kHz
  # External OLED
  - id: bus_display
    sda: ${oled_sda}
    scl: ${oled_scl}
    scan: true
    frequency: 400kHz

rtttl:
  speaker: ann_resamp
  on_finished_playback:
    - if:
        condition:
          and:
            - not:
                media_player.is_playing: esp32_media
            - not:
                media_player.is_announcing: esp32_media
            - not:
                voice_assistant.is_running
        then:
          - switch.turn_off: amp_enable

i2s_audio:
  # ESPHome cannot run mic + speaker on ONE bus (full duplex), so two buses
  # share the same physical clock pins:
  # - input (mic) = master: drives MCLK/BCLK/LRCK for ES7210 and ES8311
  # - output (speaker) = slave: only uses these clocks
  - id: i2s_input
    i2s_mclk_pin: ${i2s_mclk}
    i2s_bclk_pin:
      number: ${i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${i2s_lrclk}
      allow_other_uses: true
  - id: i2s_output
    i2s_bclk_pin:
      number: ${i2s_bclk}
      allow_other_uses: true
    i2s_lrclk_pin:
      number: ${i2s_lrclk}
      allow_other_uses: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_codec
    bits_per_sample: 16bit
    sample_rate: 16000

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_codec
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

microphone:
  - platform: i2s_audio
    id: mic_hw
    i2s_audio_id: i2s_input
    i2s_din_pin: ${i2s_din}
    adc_type: external
    pdm: false
    bits_per_sample: 16bit
    channel: left
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: spk_out
    i2s_audio_id: i2s_output
    i2s_mode: secondary
    i2s_dout_pin: ${i2s_dout}
    dac_type: external
    audio_dac: es8311_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 200ms
    timeout: never

  - platform: mixer
    id: spk_mixer
    output_speaker: spk_out
    source_speakers:
      - id: ann_in
      - id: media_in

  - platform: resampler
    id: ann_resamp
    output_speaker: ann_in

  - platform: resampler
    id: media_resamp
    output_speaker: media_in

media_player:
  - platform: speaker
    id: esp32_media
    name: "ESP32 Speaker"
    on_state:
      then:
        - if:
            condition:
              or:
                - media_player.is_playing: esp32_media
                - media_player.is_announcing: esp32_media
            then:
              - script.execute: apply_output_mode
            else:
              - switch.turn_off: amp_enable

    announcement_pipeline:
      speaker: ann_resamp
      format: WAV
      sample_rate: 16000

    media_pipeline:
      speaker: media_resamp
      format: WAV
      sample_rate: 16000

    on_play:
      then:
        - script.execute: apply_output_mode
        - script.execute: stop_wake_word
        - voice_assistant.stop
        - microphone.mute: mic_hw

    on_announcement:
      then:
        - script.execute: apply_output_mode
        - script.execute: stop_wake_word
        - microphone.mute: mic_hw

    on_idle:
      then:
        - switch.turn_off: amp_enable
        - microphone.unmute: mic_hw
        - script.execute: start_wake_word

    on_pause:
      then:
        - switch.turn_off: amp_enable
        - microphone.unmute: mic_hw
        - script.execute: start_wake_word

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: ${led_pin}
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - pulse:
          name: speaking_pulse
          min_brightness: 10%
          max_brightness: 60%
      - pulse:
          name: fast_pulse
          transition_length: 120ms
          update_interval: 120ms
          min_brightness: 20%
          max_brightness: 80%

switch:
  - platform: gpio
    id: amp_enable
    pin: ${amp_pa_pin}
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: template
    id: night_mode
    name: "Night Mode"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: display_power
    name: "Display Power"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(oled).turn_on();'
    turn_off_action:
      - lambda: 'id(oled).turn_off();'

  - platform: template
    id: mic_mute
    name: "Mute"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: stop_wake_word
      - voice_assistant.stop
      - microphone.mute: mic_hw
      - switch.turn_off: amp_enable
      - script.execute: led_mute
    on_turn_off:
      - microphone.unmute: mic_hw
      - delay: 200ms
      - script.execute: led_ready
      - script.execute: start_wake_word

display:
  - platform: ssd1306_i2c
    i2c_id: bus_display
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    rotation: 180°
    update_interval: 250ms
    lambda: |-
      int x = it.get_width() / 2;
      // Shift everything up (negative = up). The screen sits a few pixels below the window.
      int yo = -5;
      int y = it.get_height() / 2 + yo;

      // Everything: 2 s on, 1 s off (reduces OLED burn-in)
      if ((millis() / 1000) % 3 == 2) {
        return;
      }

      if (id(night_mode).state || !id(display_power).state) {
        it.print(x, y, id(font_big), TextAlign::CENTER, "");
        return;
      } else if (id(mic_mute).state && !(id(night_mode).state || !id(display_power).state)) {
        it.print(x, y, id(font_big), TextAlign::CENTER, "(-_-)");
      } else if (id(va).is_running()) {
        if (id(esp32_media).state == esphome::media_player::MEDIA_PLAYER_STATE_PLAYING && !(id(night_mode).state || !id(display_power).state)) {
          it.print(x, y, id(font_big), TextAlign::CENTER, "(^_^)");
        } else {
          it.print(x, y, id(font_big), TextAlign::CENTER, "(o_o)");
        }
      } else if (!id(timer_display_text).empty() && !(id(night_mode).state || !id(display_power).state)) {
        it.printf(x, y, id(font_big), TextAlign::CENTER, id(timer_display_text).c_str());
      } else {
        // Idle: time on top, room values at the bottom
        it.strftime(x, yo, id(font_big), TextAlign::TOP_CENTER, "%H:%M", id(esptime).now());
        it.line(8, 38 + yo, 120, 38 + yo);
        if (id(room_temp).has_state()) {
          it.printf(32, 52 + yo, id(font_mid), TextAlign::CENTER, "%.1f°C", id(room_temp).state);
        } else {
          it.print(32, 52 + yo, id(font_mid), TextAlign::CENTER, "--");
        }
        if (id(room_hum).has_state()) {
          it.printf(96, 52 + yo, id(font_mid), TextAlign::CENTER, "%.0f%%", id(room_hum).state);
        } else {
          it.print(96, 52 + yo, id(font_mid), TextAlign::CENTER, "--");
        }
      }

select:
  - platform: template
    id: audio_output_mode
    name: "Audio Output"
    optimistic: true
    restore_value: true
    initial_option: "DAC and Amp"
    options:
      - "DAC only"
      - "DAC and Amp"
    set_action:
      - globals.set:
          id: output_mode_is_amp
          value: !lambda 'return x == "DAC and Amp";'
      - script.execute: apply_output_mode
    on_value:
      - globals.set:
          id: output_mode_is_amp
          value: !lambda 'return x == "DAC and Amp";'

micro_wake_word:
  id: mww
  microphone:
    microphone: mic_hw
    channels: 0
    gain_factor: 4
  models:
    - model: hey_jarvis
      id: jarvis_model
    - model: okay_nabu
      id: nabu_model

  on_wake_word_detected:
    then:
      - script.execute: stop_wake_word
      - if:
          condition:
            switch.is_off: mic_mute
          then:
            - voice_assistant.start:
                wake_word: !lambda return wake_word;
            - delay: 2s
            - if:
                condition:
                  not:
                    voice_assistant.is_running
                then:
                  - script.execute: start_wake_word
          else:
            - script.execute: start_wake_word

voice_assistant:
  id: va
  micro_wake_word: mww
  use_wake_word: false
  microphone:
    microphone: mic_hw
    channels: 0
    gain_factor: 4
  media_player: esp32_media
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 8.0

  on_timer_tick:
    - lambda: |-
        if (!timers.empty()) {
          int total_seconds = timers[0].seconds_left;
          int minutes = total_seconds / 60;
          int seconds = total_seconds % 60;
          id(timer_display_text) = str_sprintf("%02d:%02d", minutes, seconds);
        } else {
          id(timer_display_text) = "";
        }

  on_timer_finished:
    - then:
        - micro_wake_word.stop
        - voice_assistant.stop
        - media_player.stop: esp32_media
        - lambda: |-
            id(ann_resamp).set_volume(0.8f);
            id(timer_display_text) = "";
        - rtttl.play: "timer:d=8,o=4,b=90: g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e,g,e"
        - script.execute: led_error
        - light.turn_on:
            id: status_led
            effect: fast_pulse
            red: 100%
            green: 0%
            blue: 0%
        - delay: 10s
        - rtttl.stop:
        - lambda: 'id(ann_resamp).set_volume(0.6f);'
        - light.turn_off: status_led
        - script.execute: led_ready
        - script.execute: start_wake_word

  on_listening:
    then:
      - script.execute: led_listening
      - script.execute: beep_start
  on_stt_vad_end:
    then:
      - script.execute: led_thinking
      - script.execute: beep_stop
  on_tts_start:
    then:
      - script.execute: led_speaking
  on_end:
    - wait_until:
        condition:
          and:
            - not:
                media_player.is_announcing: esp32_media
            - not:
                media_player.is_playing: esp32_media
        timeout: 15s
    - delay: 200ms
    - script.execute: start_wake_word
  on_error:
    - delay: 500ms
    - script.execute: start_wake_word

script:
  - id: apply_output_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(output_mode_is_amp);'
          then:
            - switch.turn_on: amp_enable
          else:
            - switch.turn_off: amp_enable

  - id: start_wake_word
    mode: restart
    then:
      - if:
          condition:
            and:
              - api.connected
              - switch.is_off: mic_mute
              - not:
                  voice_assistant.is_running
              - not:
                  micro_wake_word.is_running
          then:
            - delay: 100ms
            - micro_wake_word.start

  - id: stop_wake_word
    mode: restart
    then:
      - micro_wake_word.stop

  - id: led_off
    then:
      - light.turn_off: status_led

  - id: led_ready
    then:
      - light.turn_off: status_led

  - id: led_mute
    then:
      - light.turn_on:
          id: status_led
          brightness: 50%
          red: 100%
          green: 0%
          blue: 0%
          effect: none

  - id: led_error
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 100%
          green: 0%
          blue: 0%
          effect: fast_pulse

  - id: led_listening
    then:
      - light.turn_on:
          id: status_led
          brightness: 80%
          red: 0%
          green: 0%
          blue: 100%
          effect: none

  - id: led_thinking
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 100%
          green: 60%
          blue: 0%
          effect: none

  - id: led_speaking
    then:
      - light.turn_on:
          id: status_led
          brightness: 70%
          red: 0%
          green: 100%
          blue: 0%
          effect: speaking_pulse

  - id: beep_start
    mode: restart
    then:
      - script.execute: apply_output_mode
      - delay: 80ms
      - rtttl.play: "listen:d=16,o=6,b=160:c,e,g"

  - id: beep_stop
    mode: restart
    then:
      - script.execute: apply_output_mode
      - delay: 80ms
      - rtttl.play: "done:d=16,o=6,b=160:g,e,c"

interval:
  - interval: 2s
    then:
      - script.execute: start_wake_word