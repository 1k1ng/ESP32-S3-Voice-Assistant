substitutions:
  # --- General components ---
  led_pin: GPIO15      # DIN / data on the LED ring
  button_pin: GPIO17   # Touch / button signal

  # --- I2S bus 1 (currently: shared / future: speaker only) ---
  # Label on the module (e.g. MAX98357A):
  i2s_bclk: GPIO7      # BCLK / Bit Clock
  i2s_lrclk: GPIO6     # LRC / WS (Word Select)
  spk_din: GPIO5       # DIN / SD (Speaker Data In)
  
  # --- Microphone data line (currently on bus 1) ---
  mic_dout: GPIO4      # SD / DOUT (Mic Data Out)

  # --- I2S bus 2 (FUTURE: separate bus for the microphone) ---
  # After rewiring, the microphone uses its own clock lines:
  # mic_bclk: GPIO1    # SCK / BCLK on the microphone
  # mic_lrclk: GPIO2   # WS / L/R on the microphone
  # mic_dout stays on GPIO4

  # --- I2C Bus (Display) ---
  # Label on the OLED:
  i2c_sda: GPIO10      # SDA
  i2c_scl: GPIO11      # SCL

  # amp_sd_pin: GPIO18 # SD / shutdown pin (if available)

esphome:
  name: esp32s3-voice-assistant
  friendly_name: ESP32 S3 Voice Assistant
  name_add_mac_suffix: false
  on_boot:
    priority: 600
    then:
      - delay: 800ms
      - script.execute: led_boot

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_I2S_SUPPRESS_DEPRECATE_WARN: y

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    then:
      - delay: 600ms
      - if:
          condition:
            switch.is_off: mic_mute
          then:
            - script.execute: start_wake_word
            - script.execute: led_ready
          else:
            - script.execute: led_mute
  on_client_disconnected:
    then:
      - micro_wake_word.stop
      - voice_assistant.stop
      #- switch.turn_off: amp_enable
      - script.execute: led_off

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esp32s3-va-fallback
    password: !secret ap_password
  power_save_mode: NONE
  fast_connect: true
  manual_ip:
   static_ip: !secret legacy_static_ip
   gateway: !secret wifi_gateway
   subnet: !secret wifi_subnet

network:
  enable_high_performance: true

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

globals:
  - id: timer_display_text
    type: std::string
    initial_value: '""'

time:
  - platform: homeassistant
    id: esptime

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true
  frequency: 400kHz

rtttl:
  speaker: ann_resamp


captive_portal:

web_server:
  port: 80

safe_mode:
  boot_is_good_after: 10s
  num_attempts: 20

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 10
  - file: "fonts/DejaVuSans.ttf"
    id: font_big
    size: 28
    glyphs: '!"%()+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ^_abcdefghijklmnopqrstuvwxyzäöüÄÖÜß°'
 
sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr
button:
  - platform: restart
    name: "Restart"

light:
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "LED Ring"
    pin: ${led_pin}
    num_leds: 45
    chipset: ws2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    max_refresh_rate: 20ms
    reset_low: 300us
    use_dma: true
    rmt_symbols: 1536
    use_psram: false
    effects:
      - addressable_scan:
          name: thinking_spin
          move_interval: 40ms
          scan_width: 5
      - pulse:
          name: speaking_pulse
          transition_length: 500ms    
          update_interval: 500ms
          min_brightness: 10%
          max_brightness: 60%
      - addressable_flicker:
          name: listening_glow
          update_interval: 50ms
          intensity: 15%
      - pulse:
          name: slow_pulse
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 15%
          max_brightness: 60%
      - pulse:
          name: fast_pulse
          transition_length: 120ms
          update_interval: 120ms
          min_brightness: 20%
          max_brightness: 80%
      - addressable_scan:
          name: scan
          move_interval: 80ms
          scan_width: 2

switch:
  #- platform: gpio
  #  id: amp_enable
  #  name: "Amp Enable"
  #  internal: true
  #  pin:
  #    number: ${amp_sd_pin}
  #    mode:
  #      output: true
  #  restore_mode: ALWAYS_OFF

  - platform: template
    id: manual_light_mode
    name: "Manual Light Mode"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: mic_mute
    name: "Mute"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - micro_wake_word.stop
      - voice_assistant.stop
      - microphone.mute: mic_hw
      #- switch.turn_off: amp_enable
      - script.execute: led_mute
    on_turn_off:
      - microphone.unmute: mic_hw
      - delay: 200ms
      - script.execute: led_ready
      - if:
          condition:
            api.connected
          then:
            - script.execute: start_wake_word

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      int x = it.get_width() / 2;
      int y = it.get_height() / 2;

      // 1. Mute state (highest priority)
      if (id(mic_mute).state) {
        it.print(x, y, id(font_big), TextAlign::CENTER, "(-_-)"); 
      } 
      
      // 2. Active interaction (listening, thinking, speaking)
      else if (id(va).is_running()) {
        if (id(esp32_media).state == esphome::media_player::MEDIA_PLAYER_STATE_PLAYING) {
           it.print(x, y, id(font_big), TextAlign::CENTER, "(^_^)"); 
        } else {
           it.print(x, y, id(font_big), TextAlign::CENTER, "(o_o)");
        }
      } 
      
      // 3. TIMER DISPLAY (takes priority over the clock!)
      // While a timer is running, it is shown permanently
      else if (!id(timer_display_text).empty()) {
        it.printf(x, y, id(font_big), TextAlign::CENTER, id(timer_display_text).c_str());
      }
      
      // 4. IDLE / wake word active (show the clock)
      else {
        // Shows the clock only when no timer is active
        it.strftime(x, y, id(font_big), TextAlign::CENTER, "%H:%M", id(esptime).now());
      }

interval:
  - interval: 5s
    then:
      - script.execute: start_wake_word

binary_sensor:
  - platform: status
    name: "ESP Status"

  - platform: gpio
    id: touch_button
    name: "Touch Button"
    disabled_by_default: false
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 200ms
        then:
          - light.toggle: led_ring

      - timing:
          - ON for at most 350ms
          - OFF for at most 250ms
          - ON for at most 350ms
          - OFF for at least 200ms
        then:
          - switch.toggle: mic_mute

      - timing:
          - ON for at least 800ms
        then:
          - if:
              condition:
                switch.is_off: mic_mute
              then:
                - voice_assistant.start

    on_release:
      then:
        - if:
            condition:
              voice_assistant.is_running
            then:
              - voice_assistant.stop

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO7
    use_legacy: false

microphone:
  - platform: i2s_audio
    id: mic_hw
    i2s_audio_id: i2s_bus
    adc_type: external
    i2s_din_pin: GPIO4
    channel: right
    #sample_rate: 16000 # uncomment when using separate I2S buses for audio and mic
    bits_per_sample: 32bit
    use_apll: true
    pdm: false

speaker:
  - platform: i2s_audio
    id: spk_out
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO5
    channel: mono
    sample_rate: 44100
    bits_per_sample: 16bit
    use_apll: true
    buffer_duration: 200ms

  - platform: mixer
    id: spk_mixer
    output_speaker: spk_out
    source_speakers:
      - id: ann_in
      - id: media_in

  - platform: resampler
    id: ann_resamp
    output_speaker: ann_in

  - platform: resampler
    id: media_resamp
    output_speaker: media_in

media_player:
  - platform: speaker
    name: "ESP32 Speaker"
    id: esp32_media
    buffer_size: 65536
    codec_support_enabled: true

    announcement_pipeline:
      speaker: spk_out
      #num_channels: 1
      format: WAV
      sample_rate: 44100

    media_pipeline:
      speaker: media_resamp
      #num_channels: 1
      format: WAV
      sample_rate: 44100

    on_play:
      then:
        - micro_wake_word.stop
        - voice_assistant.stop
        - microphone.mute: mic_hw
        - script.execute: led_off

    on_idle:
      then:
        - script.execute: led_ready
        - microphone.unmute: mic_hw
        - script.execute: start_wake_word

    on_pause:
      then:
        - microphone.unmute: mic_hw
        - script.execute: led_ready
        - script.execute: start_wake_word


micro_wake_word:
  id: mww
  microphone:
    microphone: mic_hw
    channels: 0
    gain_factor: 4
  vad:
  models:
    - model: hey_jarvis
      id: jarvis_model
    - model: okay_nabu
      id: nabu_model

  on_wake_word_detected:
    then:
      - script.execute: stop_wake_word
      - if:
          condition:
            switch.is_off: mic_mute
          then:
            - voice_assistant.start:
                wake_word: !lambda return wake_word;
            - delay: 2s
            - if:
                condition:
                  not:
                    voice_assistant.is_running
                then:
                  - script.execute: start_wake_word
          else:
            - script.execute: start_wake_word


voice_assistant:
  id: va
  micro_wake_word: mww
  use_wake_word: false
  microphone:
    microphone: mic_hw
    channels: 0
    gain_factor: 4
  media_player: esp32_media
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 15.0

  on_timer_tick:
    - lambda: |-
        if (!timers.empty()) {
          // In the latest API 'seconds_left' is the default
          int total_seconds = timers[0].seconds_left; 
          int minutes = total_seconds / 60;
          int seconds = total_seconds % 60;
          id(timer_display_text) = str_sprintf("%02d:%02d", minutes, seconds);
        } else {
          id(timer_display_text) = "";
        }

  on_timer_finished:
    - then:
        # 1. Stop everything & free the bus
        - micro_wake_word.stop
        - voice_assistant.stop
        - media_player.stop: esp32_media
        
        # 2. RAISE VOLUME (alarm channel only)
        # 1.0f equals 100%, you can go higher (e.g. 1.5f),
        # but watch out for clipping/distortion.
        - lambda: 'id(ann_resamp).set_volume(1.0f);'
        
        - lambda: 'id(timer_display_text) = "";'
        
        # 3. Play the tone
        - rtttl.play: "alarm:d=8,o=5,b=140:4c6,4g5,4c6,4g5"
        
        # 4. Visual alarm
        - script.execute: led_error
        - light.turn_on:
            id: led_ring
            effect: fast_pulse
            red: 100%
            green: 0%
            blue: 0%
            
        - delay: 10s 
        
        # 5. Clean up & RESET VOLUME
        - rtttl.stop:
        - lambda: 'id(ann_resamp).set_volume(0.6f);' # Back to default value
        - light.turn_off: led_ring
        - script.execute: led_ready
        - script.execute: start_wake_word

  on_listening:
    - then:
        - script.execute: led_listening
        - script.execute: volume_dim # Duck music via script

  on_stt_vad_end:
    - then:
        - script.execute: led_thinking

  on_tts_start:
    - then:
        - script.execute: start_wake_word
        - script.execute: led_speaking

  on_tts_end:
    - then:
        - script.execute: volume_reset # Restore music volume via script

select:
  - platform: template
    name: "Wake word"
    id: wake_word_select
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Jarvis
      - Nabu
    initial_option: Jarvis
    on_value:
      then:
        - script.execute: stop_wake_word
        - if:
            condition:
              lambda: return x == "Jarvis";
            then:
              - micro_wake_word.enable_model: jarvis_model
              - micro_wake_word.disable_model: nabu_model
        - if:
            condition:
              lambda: return x == "Nabu";
            then:
              - micro_wake_word.enable_model: nabu_model
              - micro_wake_word.disable_model: jarvis_model
        - script.execute: start_wake_word

script:
  - id: volume_dim
    then:
      - lambda: |-
          id(media_resamp).set_volume(0.1f);
          id(media_resamp).status_set_warning(); // Optional: shows activity in the log

  - id: volume_reset
    then:
      - lambda: |-
          id(media_resamp).set_volume(0.6f);
          id(media_resamp).status_clear_warning();
  - id: apply_wake_word_model
    then:
      - if:
          condition:
            # Check for the exact name from your 'select' section
            lambda: return id(wake_word_select).current_option() == "Jarvis";
          then:
            # If Jarvis is selected, enable Jarvis
            - micro_wake_word.enable_model: jarvis_model
            - micro_wake_word.disable_model: nabu_model
          else:
            # Otherwise (if Nabu is selected)
            - micro_wake_word.enable_model: nabu_model
            - micro_wake_word.disable_model: jarvis_model
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - api.connected
              - switch.is_off: mic_mute
              - not:
                  voice_assistant.is_running
              - not:
                  micro_wake_word.is_running
          then:
            - script.execute: apply_wake_word_model
            - delay: 100ms
            - micro_wake_word.start
  - id: stop_wake_word
    then:
      - micro_wake_word.stop
  - id: led_boot
    then:
      - light.turn_on:
          id: led_ring
          brightness: 12%
          red: 100%
          green: 100%
          blue: 100%
      - delay: 700ms
      - light.turn_off: led_ring

  - id: led_off
    then:
      - light.turn_off: led_ring

  - id: led_ready
    then:
      - if:
          condition:
            switch.is_off: manual_light_mode
          then:
            - light.turn_off: led_ring

  - id: led_mute
    then:
      - light.turn_on:
          id: led_ring
          brightness: 25%
          red: 100%
          green: 0%
          blue: 0%
          effect: none

  - id: led_listening
    then:
      - light.turn_on:
          id: led_ring
          brightness: 60%
          red: 0%
          green: 0%
          blue: 100%
          effect: none

  - id: led_thinking
    then:
      - light.turn_on:
          id: led_ring
          brightness: 40%
          red: 100%
          green: 60%
          blue: 0%
          effect: none

  - id: led_speaking
    then:
      - light.turn_off: led_ring     # Short reset ensures a clean start
      - delay: 20ms
      - light.turn_on:
          id: led_ring
          brightness: 60%
          red: 0%
          green: 50%
          blue: 100%
          effect: speaking_pulse

  - id: led_error
    then:
      - light.turn_on:
          id: led_ring
          brightness: 60%
          red: 100%
          green: 0%
          blue: 0%
          effect: fast_pulse
